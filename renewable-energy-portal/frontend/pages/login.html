<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Renewable Energy Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="login-box">
        <h1>⚡ Welcome Back</h1>
        <p class="subtitle">Renewable Energy Management Portal</p>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        
        <div class="form-group">
            <label>Select Scale</label>
            <div class="scale-selector">
                <div class="scale-btn active" onclick="selectScale(this, 'small')">Small Scale</div>
                <div class="scale-btn" onclick="selectScale(this, 'large')">Large Scale</div>
            </div>
        </div>
        
        <div class="form-group">
            <label>Select Role</label>
            <div class="role-selector">
                <div class="role-btn active" onclick="selectRole(this, 'admin')">Admin</div>
                <div class="role-btn" onclick="selectRole(this, 'data_uploader')">Data Uploader</div>
            </div>
        </div>
        
        <button class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 14px;" onclick="handleLogin()">
            Login
        </button>
        
        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 0.9rem;">
            Don't have an account? <a href="#" onclick="showRegister()" style="color: var(--primary);">Create Account</a>
        </p>
        
        <div id="registerForm" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="Confirm password">
            </div>
            <button class="btn btn-secondary" style="width: 100%; justify-content: center;" onclick="handleRegister()">Create Account</button>
        </div>
        
        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 0.8rem;">
            Demo: admin / admin123 (Admin) | uploader1 / upload123 (Data Uploader)
        </p>
    </div>
    
    <script>
        let selectedRole = 'admin';
        let selectedScale = 'small';
        
        function selectRole(el, role) {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedRole = role;
        }
        
        function selectScale(el, scale) {
            document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedScale = scale;
        }
        
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (res.ok) {
                    const redirect = selectedRole === 'admin' ? '/admin' : '/energy-tracking';
                    location.href = redirect;
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch(e) {
                // Demo mode
                localStorage.setItem('user', JSON.stringify({username, role: selectedRole, scale: selectedScale}));
                const redirect = selectedRole === 'admin' ? '/admin' : '/energy-tracking';
                location.href = redirect;
            }
        }
        
        function showRegister() {
            document.getElementById('registerForm').classList.toggle('hidden');
        }
        
        async function handleRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('regConfirm').value;
            
            if (pass !== confirm) { alert('Passwords do not match'); return; }
            
            try {
                await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: name, email, password: pass, role: selectedRole, scale: selectedScale})
                });
                alert('Account created! Please login.');
            } catch(e) {
                alert('Registration failed. Try again.');
            }
        }
    </script>
</body>
</html>
